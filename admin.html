<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Administració · Cine Capri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Zilla+Slab:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">

  <section id="login" class="login" hidden>
    <form id="login-form" class="login-box">
      <p class="brand-name">Cine Capri</p>
      <h1>Administració</h1>
      <label for="pass">Contrasenya</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <p class="hint">Demo: la contrasenya és <strong>capri</strong></p>
      <p id="login-error" class="error" hidden>Contrasenya incorrecta.</p>
      <button class="btn" type="submit">Entra</button>
    </form>
  </section>

  <div id="app" hidden>
    <header class="admin-bar">
      <div class="admin-bar-inner">
        <span class="admin-brand">Cine Capri <span>· Administració</span></span>
        <nav class="admin-tabs" aria-label="Seccions">
          <button data-tab="films" class="tab">Pel·lícules</button>
          <button data-tab="settings" class="tab">Informació i preus</button>
        </nav>
        <div class="admin-bar-links">
          <a href="index.html" target="_blank" rel="noopener">Veure la web</a>
          <button id="logout" class="linklike">Surt</button>
        </div>
      </div>
    </header>
    <p class="demo-strip">Mode demostració: els canvis es guarden només en aquest navegador.</p>
    <main id="view" class="admin-main"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
